[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-no-retry"
version = "0.1.0"
description = "A pytest plugin that refuses to let your suite hide flakes behind retries."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alex Shabunin", email = "shanaleks0007@gmail.com" }]
keywords = ["pytest", "qa", "flaky", "testing", "discipline"]
requires-python = ">=3.10"
dependencies = ["pytest>=7"]
classifiers = [
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/alexshabunin/pytest-no-retry"
Issues = "https://github.com/alexshabunin/pytest-no-retry/issues"

[project.entry-points.pytest11]
no_retry = "pytest_no_retry.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_no_retry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
